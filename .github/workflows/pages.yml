name: Deploy PWA to GitHub Pages

# Publikuje całe repo jako statyczną stronę PWA.
# Uwaga: GitHub Pages na repo PRYWATNYM wymaga planu GitHub Pro/Team.
# Na koncie darmowym trzeba ustawić repo jako publiczne albo użyć innego hostingu.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
